name: Desktop CI and dev release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Typecheck, tests and workflow validation
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Unit tests, release validation tests and production build
        run: npm run check
      - name: Desktop integration tests
        run: xvfb-run -a npm run test:desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: checks-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package and test ${{ matrix.platform }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            arch: x64
            build: --linux rpm tar.gz --x64
            executable: release/linux-unpacked/dsh-switcher
          - platform: win-x64
            os: windows-2022
            arch: x64
            build: --win zip --x64
            executable: release/win-unpacked/DSH Switcher.exe
          - platform: mac-arm64
            os: macos-15
            arch: arm64
            build: --mac dmg zip --arm64
            executable: release/mac-arm64/DSH Switcher.app/Contents/MacOS/DSH Switcher
          - platform: mac-x64
            os: macos-15-intel
            arch: x64
            build: --mac dmg zip --x64
            executable: release/mac/DSH Switcher.app/Contents/MacOS/DSH Switcher
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Stamp development version
        run: node scripts/release/prepare.mjs
      - name: Unit tests on target OS
        run: npm test
      - run: npm run build
      - name: Package
        run: npx --no-install electron-builder ${{ matrix.build }} --publish never
      - name: Test packaged application
        env:
          SWITCHER_TEST_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
          SWITCHER_EXPECT_ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            xvfb-run -a npm run test:desktop
          else
            npm run test:desktop
          fi
      - name: Verify RPM on Fedora 44
        if: runner.os == 'Linux'
        run: >-
          docker run --rm
          -v "$PWD/release:/packages:ro"
          -v "$PWD/scripts/ci:/checks:ro"
          fedora:44 bash /checks/check-rpm.sh
      - name: Verify and hash distribution files
        run: node scripts/release/manifest.mjs '${{ matrix.platform }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.platform }}
          path: |
            release/*.rpm
            release/*.tar.gz
            release/*.zip
            release/*.dmg
            release/manifest-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            test-results/
            release/builder-debug.yml
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Update dev prerelease
    needs: [checks, package]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: artifacts
          merge-multiple: true
      - name: Publish verified assets to the rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish.mjs artifacts
